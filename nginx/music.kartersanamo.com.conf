# Install on VPS:
#   sudo cp nginx/music.kartersanamo.com.conf /etc/nginx/sites-available/music.kartersanamo.com
#   sudo ln -sf /etc/nginx/sites-available/music.kartersanamo.com /etc/nginx/sites-enabled/
#   sudo cp nginx/connection_upgrade.conf /etc/nginx/conf.d/connection_upgrade.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare: A/CNAME music → VPS IP, proxied (orange cloud).
# Discord OAuth redirect: https://music.kartersanamo.com/oauth/callback

server {
    listen 80;
    listen [::]:80;
    server_name music.kartersanamo.com;

    access_log /var/log/nginx/music.kartersanamo.com.access.log;
    error_log /var/log/nginx/music.kartersanamo.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
